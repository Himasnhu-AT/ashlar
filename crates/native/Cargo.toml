[package]
name = "ashlar-native"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native OS features behind one API: dialogs, menus, clipboard, power, notifications, secrets"

# The only crate allowed `unsafe`, for OS FFI (docs/adr/0001-native-ffi.md). The workspace lints are
# copied here with `unsafe_code = "deny"` instead of `forbid`, so FFI modules can opt in with
# `#[allow(unsafe_code)]`; every `unsafe` block carries a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
dbg_macro = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
undocumented_unsafe_blocks = "deny"

[features]
default = ["dialogs", "menu", "clipboard", "power", "open-files", "single-instance", "system"]
full = ["default", "notify", "progress", "secrets"]
# Open / save / folder pickers (rfd).
dialogs = ["dep:rfd"]
# A native menu bar built from a `MenuSpec` (muda; macOS and Windows).
menu = ["dep:muda", "dep:objc2", "dep:raw-window-handle"]
# Text, RGBA images and (macOS) custom pasteboard types (arboard).
clipboard = ["dep:arboard", "dep:objc2", "objc2-app-kit/NSPasteboard", "objc2-foundation/NSData", "objc2-foundation/NSArray"]
# Keep the system awake / prevent App Nap while long work runs.
power = ["dep:objc2", "objc2-foundation/NSProcessInfo", "windows/Win32_System_Power", "dep:zbus"]
# Files and URLs opened from the file manager, the command line and file associations.
open-files = [
    "dep:objc2",
    "dep:block2",
    "objc2-foundation/NSAppleEventManager",
    "objc2-foundation/NSAppleEventDescriptor",
    "objc2-foundation/NSNotification",
    "objc2-foundation/NSOperation",
    "objc2-foundation/NSData",
    "objc2-foundation/NSURL",
    "objc2-foundation/objc2-core-services",
    "objc2-foundation/block2",
    "objc2-app-kit/NSApplication",
    "objc2-app-kit/NSRunningApplication",
]
# A second launch forwards its arguments to the first over a local socket.
single-instance = []
# System notifications.
notify = [
    "dep:objc2",
    "dep:block2",
    "dep:objc2-user-notifications",
    "objc2-foundation/NSBundle",
    "objc2-foundation/NSError",
    "dep:zbus",
]
# Dock / taskbar progress and badge.
progress = [
    "dep:objc2",
    "dep:raw-window-handle",
    "objc2-app-kit/NSApplication",
    "objc2-app-kit/NSResponder",
    "objc2-app-kit/NSDockTile",
    "objc2-app-kit/NSView",
    "objc2-app-kit/NSImageView",
    "objc2-app-kit/NSControl",
    "objc2-app-kit/NSImage",
    "objc2-app-kit/NSProgressIndicator",
    "objc2-foundation/NSGeometry",
    "windows/Win32_UI_Shell",
    "windows/Win32_System_Com",
]
# Secrets in the OS keychain (Keychain, Credential Manager, Secret Service).
secrets = [
    "dep:keyring-core",
    "dep:apple-native-keyring-store",
    "dep:windows-native-keyring-store",
    "dep:zbus-secret-service-keyring-store",
]
# Appearance, accent colour, reduced motion; open a URL, reveal a file.
system = [
    "dep:objc2",
    "objc2-app-kit/NSColor",
    "objc2-app-kit/NSColorSpace",
    "objc2-app-kit/NSWorkspace",
    "objc2-app-kit/NSAccessibility",
    "objc2-app-kit/objc2-core-foundation",
    "objc2-foundation/NSUserDefaults",
    "objc2-foundation/NSURL",
    "objc2-foundation/NSArray",
    "dep:windows-registry",
    "windows/Win32_UI_WindowsAndMessaging",
    "windows/Win32_UI_Shell",
    "dep:zbus",
    "dep:web-sys",
]

[dependencies]
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ashlar-command = { workspace = true }
# Features (portal backend, no `wayland`) set once in the workspace manifest.
rfd = { workspace = true, optional = true }
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.6", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", default-features = false, optional = true, features = ["std", "NSString", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, optional = true, features = ["std"] }
objc2-user-notifications = { version = "0.3", default-features = false, optional = true, features = [
    "std",
    "block2",
    "UNUserNotificationCenter",
    "UNNotificationRequest",
    "UNNotificationContent",
    "UNNotificationTrigger",
    "UNNotificationSettings",
] }
block2 = { version = "0.6", optional = true }
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"], optional = true }
keyring-core = { version = "1", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = ["Win32_Foundation"] }
windows-registry = { version = "0.6", optional = true }
windows-native-keyring-store = { version = "1", default-features = false, optional = true }
keyring-core = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", optional = true, default-features = false, features = ["blocking-api", "async-io"] }
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"], optional = true }
keyring-core = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", optional = true, features = ["Window", "MediaQueryList"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "main_thread"
harness = false

[[example]]
name = "native_demo"
required-features = ["full"]
