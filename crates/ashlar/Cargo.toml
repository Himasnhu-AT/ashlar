[package]
name = "ashlar-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Build fast desktop and web apps in Rust: store, commands, UI, native, agent control"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["egui", "gui", "framework", "desktop", "app"]
categories = ["gui", "development-tools"]
readme = "../../README.md"

# The package is `ashlar-rs`; apps still write `use ashlar::…`.
[lib]
name = "ashlar"

[lints]
workspace = true

[features]
default = []
# The app's commands in the macOS / Windows menu bar.
native-menu = ["ashlar-app/native-menu"]
# Crash, performance and usage telemetry (always on when the app configures an endpoint).
telemetry = ["ashlar-app/telemetry"]

[dependencies]
ashlar-command = { workspace = true }
ashlar-store = { workspace = true }
ashlar-jobs = { workspace = true }
ashlar-fs = { workspace = true }
ashlar-native = { workspace = true, features = ["dialogs", "menu", "clipboard", "power", "open-files", "single-instance", "system"] }
ashlar-control = { workspace = true }
ashlar-mcp = { workspace = true }
ashlar-cli = { workspace = true }
ashlar-ui = { workspace = true }
ashlar-app = { workspace = true }
ashlar-obfuscate = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
