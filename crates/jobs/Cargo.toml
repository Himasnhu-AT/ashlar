[package]
name = "ashlar-jobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Background jobs: progress, cancel, panic isolation, apply-on-UI-thread"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["background", "jobs", "progress", "cancel", "threads"]
categories = ["concurrency", "gui"]

[lints]
workspace = true

[features]
# run jobs on rayon's global pool instead of ashlar's own bounded worker threads
rayon = ["dep:rayon"]

[dependencies]
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { version = "1", optional = true }
