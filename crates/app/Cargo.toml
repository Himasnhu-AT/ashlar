[package]
name = "ashlar-app"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ashlar runtime: App builder, frame scheduler, crash guard, logging, telemetry, agent control"

[lints]
workspace = true

[features]
default = []
# The app's commands in the macOS / Windows menu bar (ashlar-native + muda) instead of the window.
native-menu = ["ashlar-native/menu"]
# Crash, performance and usage telemetry through tracer-sdk. Nothing is sent before the user has
# seen the consent notice the runtime shows.
telemetry = ["dep:tracer-sdk"]

[dependencies]
log = { workspace = true, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
egui = { workspace = true, features = ["default_fonts"] }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
ashlar-command = { workspace = true }
ashlar-store = { workspace = true }
ashlar-jobs = { workspace = true }
ashlar-fs = { workspace = true }
ashlar-ui = { workspace = true }
ashlar-control = { workspace = true }
ashlar-cli = { workspace = true }
ashlar-native = { workspace = true, features = ["dialogs"] }
png = "0.18"
thiserror = { workspace = true }
# A sibling checkout until tracer-sdk is published; then a crates.io dependency.
tracer-sdk = { path = "../../../manager/crates/tracer-sdk", version = "0.1.0", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Element", "HtmlCanvasElement"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
