[package]
name = "ashlar-trace-server"
description = "Self-hosted backend and dashboard for ashlar-trace telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords = ["telemetry", "crash-reporting", "analytics", "self-hosted"]
categories = ["development-tools::debugging", "web-programming::http-server"]
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
ashlar-trace-proto = { workspace = true }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "server-graceful"] }
tower-service = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
flate2 = "1"
argon2 = "0.5"
maud = "0.27"
sha2 = "0.11"
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["gzip"] }

[lints]
workspace = true
