[package]
name = "tracer-server"
description = "Self-hosted backend and dashboard for the Tracer telemetry SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["telemetry", "crash-reporting", "analytics", "self-hosted"]
categories = ["development-tools::debugging", "web-programming::http-server"]
readme = "../../README.md"

[dependencies]
tracer-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
flate2 = "1"
argon2 = "0.5"
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["gzip"] }

[lints]
workspace = true
