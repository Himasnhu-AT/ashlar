[package]
name = "ashlar-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "ashlar UI components: theme tokens, controls, layout, docking, icons"

[lints]
workspace = true

[dependencies]
ashlar-command = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# same version egui's epaint uses: validates app-supplied font bytes before egui would panic on them
skrifa = { version = "0.44", default-features = false, features = ["std"] }

[features]
# docking layout persistence (serde is always available for menus, automation and keymaps)
serde = []

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
serde_json = "1"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
egui_kittest = { version = "0.36", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
