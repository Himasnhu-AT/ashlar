[package]
name = "ashlar-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "ashlar UI components: theme tokens, controls, layout, docking, icons"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["egui", "gui", "widgets", "docking", "theme"]
categories = ["gui"]

[lints]
workspace = true

[dependencies]
ashlar-command = { workspace = true }
ashlar-control = { workspace = true }
ashlar-telemetry = { workspace = true, optional = true }
log = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# screenshots travel as PNG (same encoder the runtime used before the debugger moved here)
png = "0.18"
# same version egui's epaint uses: validates app-supplied font bytes before egui would panic on them
skrifa = { version = "0.44", default-features = false, features = ["std"] }

[features]
# docking layout persistence (serde is always available for menus, automation and keymaps)
serde = []
# the telemetry frame probe and the read-only privacy section (ashlar-telemetry)
telemetry = ["dep:ashlar-telemetry"]

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
serde_json = "1"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
egui_kittest = { version = "0.36", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
