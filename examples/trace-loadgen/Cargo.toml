[package]
name = "ashlar-example-trace-loadgen"
description = "Load generator and read-path benchmark for ashlar-trace-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "loadgen"
path = "src/main.rs"

[dependencies]
ashlar-trace-proto = { workspace = true }
ashlar-trace-server = { workspace = true }
serde_json.workspace = true
flate2 = "1"
ureq = { version = "3", default-features = false, features = ["gzip"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

[lints]
workspace = true
