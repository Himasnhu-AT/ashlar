[package]
name = "ashlar-example-trace-demo-cli"
description = "A scriptable host process that exercises the SDK end to end"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "demo-cli"
path = "src/main.rs"

[dependencies]
ashlar-trace = { workspace = true, features = ["http", "sysinfo"] }
log.workspace = true

[dev-dependencies]
ashlar-trace-proto = { workspace = true }
ashlar-trace-server = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
ureq = { version = "3", default-features = false, features = ["gzip"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
serde_json.workspace = true

[lints]
workspace = true
