[package]
name = "ashlar-example-trace-demo-gui"
description = "A minimal windowed host that wires the ashlar-trace SDK by hand"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

# Kept out of the main workspace (with the glow renderer its dependency tree differs from the
# workspace's). This table makes it its own workspace root, with its own lockfile and the same
# never-crash lints. Check it with `cargo xtask trace-demo`.
[workspace]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
ashlar-trace = { path = "../../crates/trace" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
log = "0.4"

[lints]
workspace = true
