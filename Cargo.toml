[workspace]
resolver = "3"
members = ["crates/*", "xtask", "examples/demo-cli", "examples/loadgen"]
exclude = ["examples/demo-gui"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Himasnhu-AT/tracer"
authors = ["Himasnhu-AT"]

[workspace.dependencies]
tracer-proto = { path = "crates/tracer-proto", version = "0.1.0" }
tracer-sdk = { path = "crates/tracer-sdk", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.release]
lto = "thin"
