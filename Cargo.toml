[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "xtask"]
# the windowed trace demo is its own workspace (own lockfile); `cargo xtask trace-demo` checks it
exclude = ["examples/trace-demo-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
# internal
ashlar = { path = "crates/ashlar", version = "0.1.0" }
ashlar-store = { path = "crates/store", version = "0.1.0" }
ashlar-command = { path = "crates/command", version = "0.1.0" }
ashlar-jobs = { path = "crates/jobs", version = "0.1.0" }
ashlar-log = { path = "crates/log", version = "0.1.0" }
ashlar-fs = { path = "crates/fs", version = "0.1.0" }
# default features off: each crate names the native features it uses
ashlar-native = { path = "crates/native", version = "0.1.0", default-features = false }
ashlar-control = { path = "crates/control", version = "0.1.0" }
ashlar-docs = { path = "crates/docs", version = "0.1.0" }
ashlar-mcp = { path = "crates/mcp", version = "0.1.0" }
ashlar-cli = { path = "crates/cli", version = "0.1.0" }
ashlar-debug = { path = "crates/debug", version = "0.1.0" }
ashlar-ui = { path = "crates/ui", version = "0.1.0" }
ashlar-print = { path = "crates/print", version = "0.1.0" }
ashlar-app = { path = "crates/app", version = "0.1.0" }
ashlar-telemetry = { path = "crates/telemetry", version = "0.1.0" }
ashlar-trace-proto = { path = "crates/trace-proto", version = "0.1.0" }
# default features off for dependents: each names the ones it uses (`http`, `sysinfo`)
ashlar-trace = { path = "crates/trace", version = "0.1.0", default-features = false }
ashlar-trace-server = { path = "crates/trace-server", version = "0.1.0" }
# foundation
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
log = "0.4"
# ui
egui = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = { version = "0.36" }
# Without the `wayland` feature (needs the system libwayland at build time): every user inherits
# this, so feature unification never turns it back on. The portal backend serves Wayland and X11.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
muda = "0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# never crash: one place for every crate (tests are exempted by clippy.toml)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
dbg_macro = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
debug = "line-tables-only"
