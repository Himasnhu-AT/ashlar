# Dependency updates are paused: `open-pull-requests-limit: 0` stops new version-update pull
# requests. Raise the limits again (5 for cargo) to resume. Security updates stay on (repository
# settings).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
