# Publishes every crate to crates.io and creates the GitHub release. See docs/releasing.md.
#
# Publishing happens only when a version tag (`v1.2.3`) is pushed, and only after every guard
# passes: the tagged commit is on `main`, the full CI gate passes on that exact commit, the tag
# matches the workspace version, CHANGELOG.md has a dated section for it, and that version is not
# on crates.io yet. Running the workflow by hand is always a dry run that publishes nothing.
#
# Needs the repository secret CARGO_REGISTRY_TOKEN (a crates.io token with publish-new and
# publish-update). Actions are pinned by commit SHA, like ci.yml.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    name: release checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read the workspace version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ashlar-rs") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "workspace version: $version"
      - name: The tag matches the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the workspace version $VERSION"
            exit 1
          fi
      - name: The tagged commit is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main: merge it first, then tag the merge"
            exit 1
          fi
      - name: CHANGELOG.md has a dated section for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -Eq "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION] - YYYY-MM-DD' section"
            exit 1
          fi
      - name: This version is not on crates.io yet
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'ashlar-release (github.com/Himasnhu-AT/ashlar)' \
            "https://crates.io/api/v1/crates/ashlar-rs/$VERSION")
          if [ "$code" = "200" ]; then
            echo "::error::ashlar-rs $VERSION is already on crates.io: bump the version"
            exit 1
          fi

  gate:
    needs: checks
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [checks, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libxdo-dev libxkbcommon-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Dry run
        if: github.ref_type != 'tag'
        run: cargo publish --workspace --locked --dry-run
      - name: Publish to crates.io
        if: github.ref_type == 'tag'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::the repository secret CARGO_REGISTRY_TOKEN is not set"
            exit 1
          fi
          cargo publish --workspace --locked
      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          # the CHANGELOG section of this version is the release text
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "ashlar $TAG" --notes-file notes.md --verify-tag
