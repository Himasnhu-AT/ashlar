# Publishes every crate to crates.io and creates the GitHub release. See docs/releasing.md.
#
# Publishing happens only when a version tag (`v1.2.3`) is pushed, and only after every guard
# passes: the tagged commit is on `main`, the full CI gate passes on that exact commit, the tag
# matches the workspace version, CHANGELOG.md has a dated section for it, and that version is not
# on crates.io yet. Running the workflow by hand is always a dry run that publishes nothing.
#
# Needs the repository secret CARGO_REGISTRY_TOKEN (a crates.io token with publish-new and
# publish-update). Actions are pinned by commit SHA, like ci.yml.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    name: release checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read the workspace version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ashlar-rs") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "workspace version: $version"
      - name: The tag matches the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the workspace version $VERSION"
            exit 1
          fi
      - name: The tagged commit is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main: merge it first, then tag the merge"
            exit 1
          fi
      - name: CHANGELOG.md has a dated section for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -Eq "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION] - YYYY-MM-DD' section"
            exit 1
          fi
      - name: This version is not on crates.io yet
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'ashlar-release (github.com/Himasnhu-AT/ashlar)' \
            "https://crates.io/api/v1/crates/ashlar-rs/$VERSION")
          if [ "$code" = "200" ]; then
            echo "::error::ashlar-rs $VERSION is already on crates.io: bump the version"
            exit 1
          fi

  gate:
    needs: checks
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [checks, gate]
    runs-on: ubuntu-latest
    # A first release of many crates waits out the crates.io limit on new crates (see below).
    timeout-minutes: 330
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libxdo-dev libxkbcommon-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Dry run
        if: github.ref_type != 'tag'
        run: cargo publish --workspace --locked --dry-run
      - name: Publish to crates.io
        if: github.ref_type == 'tag'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::the repository secret CARGO_REGISTRY_TOKEN is not set"
            exit 1
          fi
          # crates.io refuses a version that already exists, and lets an account create only a few
          # new crates at once (then about one every 10 minutes). So: publish what is still missing,
          # wait out a rate limit, repeat. Any other error stops the job.
          crates=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.publish == null) | .name')
          for attempt in $(seq 1 40); do
            exclude=()
            missing=0
            for crate in $crates; do
              found=$(curl -s --retry 3 -o /dev/null -w '%{http_code}' -A 'ashlar-release (github.com/Himasnhu-AT/ashlar)' "https://crates.io/api/v1/crates/$crate/$VERSION")
              if [ "$found" = 200 ]; then exclude+=(--exclude "$crate"); else missing=$((missing + 1)); fi
            done
            if [ "$missing" = 0 ]; then
              echo "all crates are on crates.io at $VERSION"
              exit 0
            fi
            echo "attempt $attempt: $missing crate(s) to publish"
            set +e
            cargo publish --workspace --locked "${exclude[@]}" 2>&1 | tee publish.log
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" = 0 ]; then
              continue # the next pass confirms every crate is there
            fi
            if ! grep -q '429 Too Many Requests' publish.log; then
              echo "::error::cargo publish failed for a reason other than the crates.io rate limit"
              exit 1
            fi
            echo "rate limited by crates.io; waiting 10 minutes"
            sleep 610
          done
          echo "::error::crates still missing after 40 attempts"
          exit 1
      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          # the CHANGELOG section of this version is the release text
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "ashlar $TAG" --notes-file notes.md --verify-tag
