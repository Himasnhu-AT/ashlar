# cargo-deny: advisories, duplicate versions and sources of every dependency.
# Run with `cargo xtask advisories` (or `cargo deny check advisories bans sources`).

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported only when ashlar depends on them directly; transitive ones are
# for the upstream crates to replace.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
