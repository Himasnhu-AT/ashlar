# cargo-deny: advisories, licenses, duplicate versions and sources of every dependency.
# Run with `cargo xtask advisories` (or `cargo deny check advisories bans sources`).

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported only when ashlar depends on them directly; transitive ones are
# for the upstream crates to replace.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
# Licenses a dependency may use. A crate offering a choice (`MIT OR Apache-2.0`) passes when any
# one of them is listed here, so copyleft alternatives such as GPL or LGPL stay off the list.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0", # webpki-roots: Mozilla's root certificate data
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",             # epaint_default_fonts: bundled fonts
    "Ubuntu-font-1.0",     # epaint_default_fonts: bundled Ubuntu font
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Examples and xtask are `publish = false` and carry no license field.
ignore = true
