# Runs the Tracer server with its data in a named volume. From the repository root:
#   docker compose -f deploy/trace/compose.yml up -d
# Put a TLS-terminating reverse proxy in front of it before exposing it to the internet,
# and then set TRACER_TRUST_PROXY=1. Dashboard cookies are Secure by default, which needs HTTPS: to sign in
# over plain HTTP on this machine only, set TRACER_SECURE_COOKIES=0.
services:
  tracer:
    build:
      context: ../..
      dockerfile: deploy/trace/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      TRACER_RETENTION_DAYS: "${TRACER_RETENTION_DAYS:-90}"
      TRACER_RATE_PER_MIN: "${TRACER_RATE_PER_MIN:-120}"
      TRACER_KEY_RATE_PER_MIN: "${TRACER_KEY_RATE_PER_MIN:-6000}"
      TRACER_MAX_DB_MB: "${TRACER_MAX_DB_MB:-10240}"
      TRACER_TRUST_PROXY: "${TRACER_TRUST_PROXY:-}"
      TRACER_SECURE_COOKIES: "${TRACER_SECURE_COOKIES:-}"
    volumes:
      - tracer-data:/data

volumes:
  tracer-data:
